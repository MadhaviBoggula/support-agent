[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madhavi boggula", email = "madhaviboggula@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
