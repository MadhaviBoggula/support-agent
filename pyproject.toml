[project]
name = "support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madhavi boggula", email = "madhaviboggula@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.12",
    "mcp[cli]<2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
support-agent = "support_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
